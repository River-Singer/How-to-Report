<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; object-src 'none'">
<title>PPT Storybook</title><link rel="stylesheet" href="storybook.css"></head>
<body>
<header><div class="brand"><span class="brand-mark">P</span><div><strong>PPT Storybook</strong><small>选择组件 · 填写内容 · 引擎生成</small></div></div><div id="inventory-note"></div></header>
<div class="workspace"><aside><h2>组件目录</h2><nav id="kinds" aria-label="组件类型"></nav><label for="source">来源</label><select id="source"><option value="">全部来源</option></select><label for="category">图表关系</label><select id="category"><option value="">全部关系</option></select><label class="check"><input type="checkbox" id="executable" checked>仅可调用条目</label><label class="check"><input type="checkbox" id="hidden">显示隐藏或兼容分支对象</label><p class="aside-note">源对象保留原稿样式。参数组件按输入重新计算。每项的实际可变范围见详情。</p></aside>
<main><div class="heading"><div><p class="eyebrow">ENGINE COMPONENT LIBRARY</p><h1 id="heading">所有可调用组件</h1></div><label class="search"><span class="sr-only">搜索组件</span><input id="search" type="search" placeholder="搜索图表、模板、图标或文字…"></label></div>
<section class="palette-bar" aria-label="全局配色"><div><label for="palette">全局配色</label><select id="palette"><option value="">保留现有配色（默认）</option></select></div><div id="palette-swatches" class="swatches" aria-label="所选色卡"></div><p id="palette-status" role="status">仅控制引擎生成请求。原生保真资产保持源颜色；当前预览不会自动重算。</p></section>
<section class="text-profile-bar" aria-label="全局文字规范"><div><strong>全局文字规范</strong><p id="text-profile-summary">查看当前引擎规范与支持范围</p></div><button id="show-text-profile" class="quiet" disabled>查看字体、段落与富文本</button><p class="muted">绑定report-14pt的computed新稿执行生成文字下限；原生资产与源几何内文字保留原格式。</p></section>
<div class="selection-bar"><span id="selection-count">已选 0 个原生资产</span><label>排列列数 <select id="columns"><option value="">自动</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label><button id="download-selection" disabled>下载组合请求</button><button id="clear-selection" disabled class="quiet">清空</button></div>
<p class="results" id="results" role="status" aria-live="polite"></p><section id="cards" class="cards" aria-label="组件结果"></section><div class="pagination"><button id="previous">上一页</button><span id="page-info"></span><button id="next">下一页</button></div></main></div>
<dialog id="detail"><div class="dialog-head"><div><p class="eyebrow" id="detail-kind"></p><h2 id="detail-title"></h2></div><button id="close-detail" aria-label="关闭详情">关闭</button></div><div class="detail-grid"><div><div id="detail-preview"></div><p id="preview-scope" class="muted"></p><h3>用途与使用边界</h3><p id="detail-purpose"></p><ul id="limitations"></ul><div id="relations"></div></div><div><div class="badges" id="detail-badges"></div><p class="id" id="detail-id"></p><h3>参数请求</h3><p id="request-note" class="muted"></p><textarea id="request" spellcheck="false" aria-label="组件参数请求"></textarea><div class="actions"><button id="download-request">下载请求</button><button id="copy-request" class="quiet">复制请求</button></div><p id="request-status" role="status"></p><h3>引擎调用</h3><pre id="command"></pre><details><summary>输入规格、来源与能力</summary><pre id="contract"></pre></details></div></div></dialog>
<script src="data/index.js"></script><script src="storybook-requests.js"></script><script src="storybook.js"></script></body></html>
